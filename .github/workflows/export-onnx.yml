name: Export SD1.5 to ONNX Pack

on:
  push:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  convert-models:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    # NEW STEP: This installs the missing "hf" command-line tool
    - name: Install Hugging Face CLI
      run: |
        python -m pip install "huggingface_hub[cli]"

    # This runs your setup script (installing torch, onnx, etc.)
    - name: Run Setup Script
      run: |
        chmod +x tools/sd1/setup_venv.sh
        ./tools/sd1/setup_venv.sh

    # This runs your model download script
    - name: Download Stable Diffusion 1.5 Models
      run: |
        chmod +x tools/sd1/download_sd15.sh
        ./tools/sd1/download_sd15.sh

    # This converts the downloaded models to ONNX format
    - name: Export to ONNX Format
      run: |
        cd tools/sd1
        ./.venv/bin/python export_sd15_to_onnx.py --in ./_cache/sd15 --out ./_out/sd15-onnx
        
