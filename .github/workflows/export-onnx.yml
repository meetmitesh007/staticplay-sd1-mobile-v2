name: Export SD1.5 to ONNX Pack

on:
  push:
    branches: [ "master" ] # Automatically starts the script every time you save a change
  workflow_dispatch: # Keeps the manual button option just in case

jobs:
  convert-models:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Run Setup Script
      run: |
        chmod +x tools/sd1/setup_venv.sh
        ./tools/sd1/setup_venv.sh

    - name: Export to ONNX Format
      run: |
        cd tools/sd1
        ./.venv/bin/python export_sd15_to_onnx.py --in ./_cache/sd15 --out ./_out/sd15-onnx
        
