name: Export SD1.5 to ONNX Pack

on:
  workflow_dispatch: # Allows you to manually click and run this pipeline

jobs:
  convert-models:
    runs-on: ubuntu-latest

    steps:
    # Step 0: Clone the code repository
    - name: Checkout Code
      uses: actions/checkout@v4

    # Step 0: Initialize Python environment (Matching documentation prerequisite)
    - name: Setup Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    # Step 1: Create venv + install deps
    - name: Create venv and Install Dependencies
      run: |
        chmod +x tools/sd1/setup_venv.sh
        ./tools/sd1/setup_venv.sh

    # Step 2: Download SD1.5 (diffusers format)
    # Note: If the script requires a Hugging Face token, see the follow-up note below.
    - name: Download SD1.5 Models
      run: |
        chmod +x tools/sd1/download_sd15.sh
        ./tools/sd1/download_sd15.sh

    # Step 3: Export components to ONNX
    - name: Export to ONNX Format
      run: |
        cd tools/sd1
        ./.venv/bin/python export_sd15_to_onnx.py --in ./_cache/sd15 --out ./_out/sd15-onnx

    # Step 4: Automate the delivery of your final outputs
    - name: Upload ONNX Model Pack Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: sd15-onnx-model-pack
        path: tools/sd1/_out/sd15-onnx/
        retention-days: 5
        
